name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-app:
    name: validate-app
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"

      - name: Run unit tests
        env:
          LOCALAPPDATA: ${{ runner.temp }}/lfs-antivirus-aaha-tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q lfs_antivirus_aaha tests

  linux-source:
    name: linux-source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"

      - name: Run Linux source gates
        env:
          LOCALAPPDATA: ${{ runner.temp }}/lfs-antivirus-aaha-tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q lfs_antivirus_aaha packaging tests
          git diff --check
